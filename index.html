<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Johnson Funeral Home & Crematory provides compassionate funeral, memorial, and cremation care to families across the River Valley."
    />
    <title>Johnson Funeral Home &amp; Crematory | Honoring Every Life</title>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('theme');
          if (storedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (error) {
          /* localStorage unavailable */
        }
      })();
    </script>
    <link rel="stylesheet" href="assets/css/site.css" />
    <script src="assets/js/main.js" defer></script>
    <!-- Passage Embed Script -->
    <script src="assets/js/passage-embed.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <!-- header content as before -->
    </header>

    <main id="top">
      <section class="hero">
        <!-- hero content as before -->
      </section>

      <!-- Family Portal Section -->
      <section id="passagecare-section" class="section">
        <div class="container">
          <h2>Family Portal</h2>
          <div id="passagecare-root"></div>
        </div>
      </section>

      <section class="section section-alt" id="services">
        <!-- services content as before -->
      </section>

      <!-- other sections as before -->
    </main>

    <footer>
      <!-- footer content as before -->
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      // Scroll from portal button to the embedded Family Portal
      document.querySelectorAll('.btn-portal').forEach(btn => {
        btn.addEventListener('click', () => {
          const portal = document.getElementById('passagecare-section');
          if (portal) portal.scrollIntoView({ behavior: 'smooth' });
        });
      });

      // Initialize Passage Embed with dynamic styling
      window.addEventListener('DOMContentLoaded', () => {
        // Get computed styles from the site
        const bodyStyles = getComputedStyle(document.body);
        const primaryBtn = document.querySelector('.btn-primary');
        const primaryColor = primaryBtn ? getComputedStyle(primaryBtn).backgroundColor : '#007bff';

        const embed = new PassageEmbed({
          funeralHomeId: 'TEST_FH',   // Replace with real FH ID for live deployment
          apiKey: 'TEST_KEY',         // Replace with valid API key
          containerId: 'passagecare-root',
          themeOptions: {
            fontFamily: bodyStyles.fontFamily,
            backgroundColor: bodyStyles.backgroundColor,
            primaryColor: primaryColor,
          }
        });

        embed.render();
      });
    </script>
  </body>
</html>
