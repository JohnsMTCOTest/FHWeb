<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Family Portal | Johnson Funeral Home & Crematory</title>
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a href="index.html" class="brand">Johnson <span>Funeral Home &amp; Crematory</span></a>
        <nav>
          <a href="index.html">Home</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <h1>Family Portal</h1>
        <p>Access your case updates, documents, and messages below.</p>
        <div id="passagecare-root" style="margin-top:2rem;"></div>
      </div>
    </main>

    <footer>
      <div class="footer-bottom">
        &copy; <span id="year">2024</span> Johnson Funeral Home &amp; Crematory
      </div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>

    <!-- Simplified test loader -->
    <script>
      const root = document.getElementById('passagecare-root');
      const iframe = document.createElement('iframe');
      iframe.src = "https://thepassagecare.com/demo"; // your demo or live portal URL
      iframe.style.width = "100%";
      iframe.style.height = "750px";
      iframe.style.border = "none";
      iframe.style.borderRadius = "8px";
      root.appendChild(iframe);
    </script>
  </body>
</html>
